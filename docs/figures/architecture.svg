<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="380" fill="#ffffff"/>
  <!-- clients -->
  <rect x="12" y="150" width="92" height="56" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="58" y="174" text-anchor="middle" font-weight="600">Clients</text>
  <text x="58" y="191" text-anchor="middle" font-size="10" fill="#475569">X-Client-Id</text>
  <!-- gateway -->
  <rect x="140" y="140" width="118" height="76" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="199" y="163" text-anchor="middle" font-weight="600">gateway</text>
  <text x="199" y="179" text-anchor="middle" font-size="10">NGINX · :8000</text>
  <text x="199" y="194" text-anchor="middle" font-size="10" fill="#0369a1">répartition, bascule</text>
  <text x="199" y="207" text-anchor="middle" font-size="10" fill="#0369a1">timeouts</text>
  <!-- api replicas -->
  <rect x="300" y="88" width="190" height="180" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-dasharray="5 3"/>
  <text x="395" y="106" text-anchor="middle" font-weight="600" fill="#0f766e">shopflow-api × 2 réplicas</text>
  <rect x="314" y="116" width="162" height="64" rx="7" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="395" y="134" text-anchor="middle" font-size="10.5">entrée : rate limiting → load</text>
  <text x="395" y="148" text-anchor="middle" font-size="10.5">shedding → capacité (8 workers)</text>
  <text x="395" y="165" text-anchor="middle" font-size="10.5" fill="#0f766e">sondes live / ready / startup</text>
  <rect x="314" y="190" width="162" height="64" rx="7" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="395" y="208" text-anchor="middle" font-size="10.5">sortie : timeout, deadline,</text>
  <text x="395" y="222" text-anchor="middle" font-size="10.5">retry, circuit breaker, bulkhead,</text>
  <text x="395" y="237" text-anchor="middle" font-size="10.5">fallback / cache / dégradation</text>
  <!-- deps -->
  <rect x="560" y="40" width="180" height="60" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="650" y="62" text-anchor="middle" font-weight="600">stock</text>
  <text x="650" y="78" text-anchor="middle" font-size="10">critique · repli : cache</text>
  <text x="650" y="91" text-anchor="middle" font-size="10" fill="#b45309">flaky_service · admin :8081</text>
  <rect x="560" y="148" width="180" height="60" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="650" y="170" text-anchor="middle" font-weight="600">reco</text>
  <text x="650" y="186" text-anchor="middle" font-size="10">optionnelle · repli : liste vide</text>
  <text x="650" y="199" text-anchor="middle" font-size="10" fill="#b45309">flaky_service · admin :8082</text>
  <rect x="560" y="256" width="180" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="650" y="278" text-anchor="middle" font-weight="600">payment</text>
  <text x="650" y="294" text-anchor="middle" font-size="10">critique · retry idempotent</text>
  <text x="650" y="307" text-anchor="middle" font-size="10" fill="#b91c1c">flaky_service · admin :8083</text>
  <!-- arrows -->
  <line x1="104" y1="178" x2="138" y2="178" stroke="#334155" stroke-width="1.6" marker-end="url(#f)"/>
  <line x1="258" y1="178" x2="298" y2="178" stroke="#334155" stroke-width="1.6" marker-end="url(#f)"/>
  <line x1="490" y1="200" x2="558" y2="72" stroke="#334155" stroke-width="1.6" marker-end="url(#f)"/>
  <line x1="490" y1="215" x2="558" y2="178" stroke="#334155" stroke-width="1.6" marker-end="url(#f)"/>
  <line x1="490" y1="232" x2="558" y2="284" stroke="#334155" stroke-width="1.6" marker-end="url(#f)"/>
  <text x="515" y="118" font-size="10" fill="#475569">GET /stock</text>
  <text x="510" y="190" font-size="10" fill="#475569">GET /reco</text>
  <text x="497" y="272" font-size="10" fill="#475569">POST /payments</text>
  <!-- observability -->
  <rect x="300" y="318" width="120" height="48" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="360" y="338" text-anchor="middle" font-weight="600">Prometheus</text>
  <text x="360" y="353" text-anchor="middle" font-size="10">SLO · alertes</text>
  <rect x="140" y="318" width="118" height="48" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="199" y="338" text-anchor="middle" font-weight="600">Grafana</text>
  <text x="199" y="353" text-anchor="middle" font-size="10">tableau de bord</text>
  <line x1="395" y1="316" x2="395" y2="270" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <text x="402" y="300" font-size="10" fill="#6d28d9">scrape /metrics (DNS)</text>
  <line x1="298" y1="342" x2="260" y2="342" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <text x="560" y="350" font-size="10" fill="#475569">Docker Compose · réseau interne</text>
  <text x="560" y="364" font-size="10" fill="#475569">Kubernetes : manifestes k8s/</text>
</svg>
