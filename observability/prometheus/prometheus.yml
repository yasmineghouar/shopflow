global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Chaque réplica de l'API est découverte par le DNS Docker (nom de service "api").
  - job_name: shopflow-api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000
        refresh_interval: 5s

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
