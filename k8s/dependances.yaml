---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock
  namespace: shopflow
  labels: {app: stock}
spec:
  replicas: 1                   # dépendance volontairement instable (simulée), non répliquée
  selector:
    matchLabels: {app: stock}
  template:
    metadata:
      labels: {app: stock}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: stock
          image: shopflow-deps:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: stock
  namespace: shopflow
spec:
  selector: {app: stock}
  ports:
    - {name: http, port: 8080, targetPort: http}
